<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Walking Path</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="panel">
    <header>
      <h1>Walking Path</h1>
      <p class="tagline">NYC walking routes that steer around live street flooding and toward tree shade when it's hot.</p>
    </header>

    <form id="trip" autocomplete="off">
      <label>From
        <input id="from" placeholder="Address or click the map" required>
        <ul class="suggest" data-for="from"></ul>
      </label>
      <label>To
        <input id="to" placeholder="Address or click the map" required>
        <ul class="suggest" data-for="to"></ul>
      </label>
      <label>Heat
        <select id="heat">
          <option value="auto">Auto, from current weather</option>
          <option value="on">It's hot, find shade</option>
          <option value="off">Ignore heat</option>
        </select>
      </label>
      <button type="submit" id="go">Find routes</button>
    </form>

    <section id="conditions" hidden></section>
    <p id="status" role="status"></p>
    <ol id="routes"></ol>

    <footer>
      Data: <a href="https://www.floodnet.nyc" target="_blank" rel="noopener">FloodNet NYC</a>,
      <a href="https://data.cityofnewyork.us/d/hn5i-inap" target="_blank" rel="noopener">NYC Parks street trees</a>,
      <a href="https://www.weather.gov" target="_blank" rel="noopener">NWS</a>,
      routes &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>.
      Sensors only cover the spots they're mounted at; always use your own judgment around water.
    </footer>
  </aside>
  <main id="map"></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
