# Render Blueprint: in Render, choose New > Blueprint and pick this repo.
services:
  - type: web
    name: walking-path
    runtime: node
    plan: free
    buildCommand: "true" # no dependencies to install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_VERSION
        value: "22"
